app = "epic-overview"
primary_region = "fra"

[build]

# The shared game is saved to this volume so it survives restarts and deploys.
# Created once with:  fly volumes create epic_data --region fra --size 1 -a epic-overview
[mounts]
  source = "epic_data"
  destination = "/data"

[env]
  # The GitHub Pages copy of web/ calls this server from another origin.
  EPIC_ALLOW_ORIGINS = "https://flomotiongo.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when no device is connected; the first request wakes it in a few seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/api/state"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
