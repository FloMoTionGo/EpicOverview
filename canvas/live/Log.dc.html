<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#ead08a}a:hover{color:#fff1c9}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1180px;height:820px;box-sizing:border-box;display:flex;flex-direction:column;background:#211710;color:#eadfc8;font-family:'EB Garamond',Georgia,serif;overflow:hidden">

  <header style="height:68px;flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid #5a4330">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#c4473a,#8d2a22 55%,#5e1912);box-shadow:0 0 0 3px #211710,0 0 0 5px #c9a24c;font:600 22px 'Barlow Semi Condensed',sans-serif;color:#fbe9cf">4</div>
      <div style="line-height:1.1"><div style="font-size:20px;font-weight:700">Round 4</div><div style="font-size:14px;color:#b9a88a">of 12</div></div>
    </div>
    <div style="flex:1"></div>
    <a href="Choose-House.dc.html" aria-label="Playing as Greyjoy on this device. Change house" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;border-radius:24px;border:1px solid #5a4330;background:#2b1f16;color:#eadfc8;text-decoration:none"><img src="/_blob/c928f54c08f0c97af6e1e38ef5ba1339" alt="" style="width:36px;height:36px"><span style="line-height:1.05"><span style="display:block;font:500 12px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">Playing as</span><span style="font-size:17px;font-weight:600">Greyjoy</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b9a88a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
    <button type="button" style="min-height:48px;padding:0 18px;border-radius:10px;border:1px solid #5a4330;background:#3b2a1d;color:#eadfc8;font-size:16px">Undo</button>
  </header>

  <main style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 20px">
    <div style="display:flex;align-items:baseline;gap:14px">
      <h1 style="margin:0;font-size:26px">Log</h1>
      <span style="font:500 15px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">Every change from every phone and tablet, newest first, with the house that made it. Undo takes back the newest change and logs that too.</span>
    </div>
    <div role="group" aria-label="Show" style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.choose }}" style="{{ c.style }}">{{ c.name }}</button>
      </sc-for>
      <span style="margin-left:auto;align-self:center;font:500 14px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">{{ count }}</span>
    </div>

    <ol aria-label="Changes" style="list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-top:1px solid #5a4330">
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="8">
        <li style="{{ e.box }}">
          <span style="font:600 15px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">{{ e.time }}</span>
          <span style="font:500 14px 'Barlow Semi Condensed',sans-serif;color:#b9a88a;line-height:1.15">{{ e.where }}</span>
          <span style="display:flex;align-items:center;gap:6px;min-width:0">
            <sc-for list="{{ e.sigils }}" as="g" hint-placeholder-count="1">
              <img src="{{ g }}" alt="" style="width:28px;height:28px;flex:none">
            </sc-for>
            <span style="{{ e.textStyle }}">{{ e.text }}</span>
          </span>
          <span style="{{ e.tagStyle }}">{{ e.tag }}</span>
          <span style="display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;font:500 14px 'Barlow Semi Condensed',sans-serif;color:#b9a88a"><img src="{{ e.bySigil }}" alt="" style="width:22px;height:22px;flex:none"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ e.by }}</span></span>
        </li>
      </sc-for>
    </ol>
  </main>

  <section aria-label="Houses" style="height:88px;flex:none;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;padding:8px 20px;border-top:1px solid #5a4330;background:rgba(0,0,0,.25)">
    <sc-for list="{{ seats }}" as="h" hint-placeholder-count="9">
      <button type="button" style="{{ h.box }}">
        <span style="display:flex;align-items:center;gap:6px;min-width:0">
          <img src="{{ h.sigil }}" alt="" style="width:30px;height:30px;flex:none">
          <span style="font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h.name }}</span>
          <sc-if value="{{ h.ring }}" hint-placeholder-val="{{ true }}">
            <img src="/_blob/e741fb83f9639123ab54e54782e5ee35" alt="Ring still available" title="Ring still available" style="width:22px;height:22px;flex:none">
          </sc-if>
          <sc-if value="{{ h.noRing }}" hint-placeholder-val="{{ false }}">
            <img src="/_blob/d47cecb41a5325c4d45cd0db3377f88e" alt="Ring used" title="Ring used" style="width:22px;height:22px;flex:none">
          </sc-if>
        </span>
        <span style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;line-height:1">
          <span style="font:600 16px 'Barlow Semi Condensed',sans-serif">{{ h.castles }}<span style="display:block;font:500 11px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">castles</span></span>
          <span style="font:600 16px 'Barlow Semi Condensed',sans-serif">{{ h.vp }}<span style="display:block;font:500 11px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">VP</span></span>
          <span style="font:600 16px 'Barlow Semi Condensed',sans-serif">{{ h.obj }}<span style="display:block;font:500 11px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">obj.</span></span>
          <span style="font:600 16px 'Barlow Semi Condensed',sans-serif">{{ h.supply }}<span style="display:block;font:500 11px 'Barlow Semi Condensed',sans-serif;color:#b9a88a">supply</span></span>
        </span>
        <span style="font:500 12px 'Barlow Semi Condensed',sans-serif;color:#ead08a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:32px">{{ h.badges }}</span>
        <span style="position:absolute;right:6px;bottom:5px;display:flex;gap:3px">
          <sc-for list="{{ h.loans }}" as="l" hint-placeholder-count="0">
            <span role="img" aria-label="{{ l.label }}" title="{{ l.label }}" style="{{ l.style }}"></span>
          </sc-for>
        </span>
      </button>
    </sc-for>
  </section>

  <nav aria-label="Views" style="height:64px;flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #5a4330;background:#1a120c">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7">
      <a href="{{ t.href }}" aria-current="{{ t.current }}" style="{{ t.style }}">{{ t.name }}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      lannister: '/_blob/00239e7f6cc5b8d22fc12a61b33a4ddc', tyrell: '/_blob/8e6473f7f37f3ef492e364d6c0a850dd',
      bolton: '/_blob/0ace54556eeed7d5ca3e26e98bfc9c1c', arryn: '/_blob/6b463f5e8229b1a7db8e88bd5ed250c1',
      martell: '/_blob/cd0279272519d4f3293cd9d1fe172d58', greyjoy: '/_blob/c928f54c08f0c97af6e1e38ef5ba1339',
      red: '/_blob/fb608f52c5c17e75116f81e672eb9225', tully: '/_blob/c58a744e9a9e4f7cd16876c20ec22c00',
      white: '/_blob/8ad4c612e167275bb3c11b04d714ffe6'
    };
    const N = { lannister: 'Lannister', tyrell: 'Tyrell', bolton: 'Bolton', arryn: 'Arryn', martell: 'Martell', greyjoy: 'Greyjoy', red: 'Red Targaryen', tully: 'Tully', white: 'White Targaryen' };
    const st = this.state || {};
    const filter = st.filter || 'all';
    // time, round, where in the round, houses, change, kind, device, state
    const LOG = [
      ['21:42', 4, 'Diplomacy 7, New loans', ['lannister'], 'Lannister took a Gold loan. Bank: 4 Gold loans left.', 'loans', 'lannister', ''],
      ['21:41', 4, 'Diplomacy 6, Loan interest', ['lannister'], 'Lannister paid interest: 1 Gold.', 'loans', 'lannister', ''],
      ['21:38', 4, 'Diplomacy 5, Change levels', ['arryn', 'tully'], 'Arryn and Tully raised to Alliance.', 'relations', 'tully', ''],
      ['21:37', 4, 'Diplomacy 5, Change levels', ['bolton', 'tully'], 'Bolton and Tully raised to Alliance.', 'relations', 'bolton', ''],
      ['21:36', 4, 'Diplomacy 5, Change levels', ['greyjoy', 'martell'], 'Greyjoy broke the Truce with Martell. Greyjoy pays 3.', 'relations', 'greyjoy', ''],
      ['21:35', 4, 'Diplomacy 5, Change levels', ['tyrell', 'martell'], 'Tyrell and Martell raised to Truce.', 'relations', 'martell', ''],
      ['21:33', 4, 'Diplomacy 5, Change levels', ['greyjoy', 'martell'], 'Greyjoy and Martell raised to Alliance.', 'relations', 'greyjoy', 'undone'],
      ['21:31', 4, 'Westeros, Deck IV', [], 'Bands of Outlaws: bids 7 against target 5, won. The highest bidder took 3 Gold.', 'westeros', 'arryn', ''],
      ['21:29', 4, 'Westeros, Master of Laws', ['bolton'], 'Bolton replaced Thwarted Plans (deck I) with Shifting Ambitions.', 'westeros', 'bolton', ''],
      ['21:27', 4, 'Westeros, Supply', ['arryn'], 'Arryn supply 2 → 3.', 'houses', 'arryn', ''],
      ['21:20', 3, 'Action 2, March orders', ['tyrell'], 'Tyrell castles 3 → 4.', 'houses', 'tyrell', '']
    ];
    const CH = [['all', 'All changes'], ['round', 'This round'], ['relations', 'Relations'], ['loans', 'Loans'], ['houses', 'Houses'], ['westeros', 'Westeros']];
    const chips = CH.map(([k, name]) => ({
      name, pressed: k === filter ? 'true' : 'false',
      choose: () => this.setState({ filter: k }),
      style: 'min-height:44px;padding:0 16px;border-radius:22px;font:600 15px Barlow Semi Condensed,sans-serif;' +
        (k === filter ? 'border:0;background:#e8d7ae;color:#2a2017' : 'border:1px solid #5a4330;background:#3b2a1d;color:#eadfc8')
    }));
    const shown = LOG.filter((e) => filter === 'all' || (filter === 'round' ? e[1] === 4 : e[5] === filter));
    const entries = shown.slice(0, 9).map(([time, round, where, houses, text, kind, device, state]) => ({
      time, where: 'Round ' + round + ', ' + where, sigils: houses.map((k) => S[k]), text, by: N[device], bySigil: S[device],
      tag: state === 'undone' ? 'undone 21:34' : '',
      textStyle: 'min-width:0;font-size:16px;line-height:1.2;' + (state === 'undone' ? 'text-decoration:line-through;color:#8a7a62' : ''),
      tagStyle: 'font:600 12px Barlow Semi Condensed,sans-serif;' + (state === 'undone' ? 'padding:2px 8px;border-radius:99px;border:1px solid #8a7a62;color:#b9a88a' : ''),
      box: 'min-height:52px;display:grid;grid-template-columns:52px 210px minmax(0,1fr) 92px 150px;align-items:center;gap:12px;padding:2px 6px;border-bottom:1px solid #3b2a1d'
    }));
    const count = shown.length + (shown.length === 1 ? ' change' : ' changes') + ' shown';
    const SUP = { lannister: 1, tyrell: 2, bolton: 0, arryn: 3, martell: 1, greyjoy: 0, red: 1, tully: 0, white: 2 };
    const LOAN = { lannister: ['Gold loan'], greyjoy: ['Red loan: 1 Victory Point less'], white: ['Red loan: 8th on Fiefdoms'] };
    const loanStyle = (label) => 'display:block;width:12px;height:17px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.6);' +
      (label.indexOf('Gold') === 0 ? 'background:linear-gradient(160deg,#f0d77a,#a8801f);border:1px solid #5e4a12' : 'background:linear-gradient(160deg,#d0503f,#7a1a14);border:1px solid #3a0d0a');
    const seatData = [
      ['lannister', '#a3262a', 5, 3, 2, 'Hand', false],
      ['tyrell', '#4d7a2c', 4, 2, 1, 'Kingsguard', true],
      ['bolton', '#b56a73', 4, 1, 1, 'Laws', false],
      ['arryn', '#5d8fc4', 3, 2, 1, 'Maester', true],
      ['martell', '#d27a2c', 3, 1, 1, 'Coin', true],
      ['greyjoy', '#8a8d91', 4, 1, 2, 'Ships', true],
      ['red', '#8a1520', 2, 1, 1, 'Whispers', false],
      ['tully', '#2c4f86', 3, 0, 0, 'No council seat', true],
      ['white', '#d8d2c4', 2, 1, 1, 'No council seat', true]
    ];
    const seats = seatData.map(([k, color, castles, vp, obj, badges, ring]) => ({
      name: N[k], sigil: S[k], castles, vp, obj, badges, ring, noRing: !ring, supply: SUP[k],
      loans: (LOAN[k] || []).map((label) => ({ label, style: loanStyle(label) })),
      box: 'position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:1px;min-width:0;padding:5px 8px;text-align:left;color:#eadfc8;border-radius:0 0 8px 8px;' +
        'border-top:4px solid ' + color + ';border-left:1px solid #5a4330;border-right:1px solid #5a4330;border-bottom:1px solid #5a4330;background:rgba(59,42,29,.6)'
    }));
    const tabs = [['Round', 'Round-D7'], ['Houses', 'Houses'], ['Relations', 'Relations'], ['Westeros', 'Westeros'], ['Loans', 'Loans'], ['Market', 'Market'], ['Log', 'Log']].map(([name, file], i) => ({
      name, href: file + '.dc.html', current: i === 6 ? 'page' : 'false',
      style: 'min-height:56px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;' + (i === 6 ? 'color:#ead08a;box-shadow:inset 0 3px 0 #c9a24c' : 'color:#b9a88a')
    }));
    return { chips, entries, count, seats, tabs };
  }
}
</script>
</body>
</html>
